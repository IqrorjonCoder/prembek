<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✅ Buyurtma Qabul Qilindi - Prem_Bek</title>
    <link rel="stylesheet" href="shared-styles.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        .success-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 50px 40px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .checkmark {
            width: 80px;
            height: 80px;
            margin: 0 auto 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            color: white;
            animation: popIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes popIn {
            0% {
                transform: scale(0);
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
            }
        }

        h1 {
            color: #333;
            font-size: 32px;
            margin: 20px 0;
            font-weight: 700;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .details {
            background: #f8f9ff;
            border-left: 4px solid #667eea;
            padding: 20px;
            border-radius: 10px;
            text-align: left;
            margin: 30px 0;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e0e0e0;
            font-size: 14px;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #666;
            font-weight: 600;
        }

        .detail-value {
            color: #333;
            font-weight: 700;
        }

        .info-box {
            background: #fff8e1;
            border: 2px solid #ffa000;
            border-radius: 10px;
            padding: 15px;
            margin: 20px 0;
            font-size: 14px;
            color: #e65100;
            line-height: 1.6;
        }

        .info-box strong {
            color: #e65100;
            display: block;
            margin-bottom: 8px;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 150px;
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #667eea;
        }

        .btn-secondary:hover {
            background: #f8f9ff;
        }

        .timer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
            color: #666;
            font-size: 14px;
        }

        .timer-text {
            color: #667eea;
            font-weight: 700;
            font-size: 18px;
        }

        .icon-emoji {
            font-size: 40px;
            margin-bottom: 10px;
        }

        @media (max-width: 600px) {
            .success-container {
                padding: 40px 25px;
            }

            h1 {
                font-size: 26px;
            }

            .buttons {
                flex-direction: column;
            }

            .btn {
                min-width: auto;
            }
        }
    </style>
</head>
<body>

    <div class="success-container">
        <div class="checkmark">✅</div>
        <h1 id="title">Buyurtma Qabul Qilindi!</h1>
        
        <p class="subtitle" id="subtitle">
            Sizning buyurtmangiz muvaffaqiyatli taqdim etildi
        </p>

        <div class="details" id="details">
            <!-- Details will be added here -->
        </div>

        <div class="info-box">
            <strong>⏱️ Aktivatsiya vaqti:</strong>
            Sizning buyurtmangiz <strong>2 daqiqada</strong> amalga oshiriladi!
        </div>

        <div class="info-box">
            <strong>📌 Diqqat:</strong>
            Agar to'lov bilan bog'liq muammo bo'lsa, aloqa uchun kiritgan raqamga yozamiz.
        </div>

        <div class="timer">
            <div>Asosiy sahifaga qaytish:</div>
            <div class="timer-text"><span id="countdown">10</span> soniyada...</div>
        </div>

        <div class="buttons">
            <button class="btn btn-primary" onclick="goHome()">🏠 Asosiy Sahifaga</button>
            <button class="btn btn-secondary" onclick="newOrder()">➕ Yangi Buyurtma</button>
        </div>
    </div>

    <script>
        // Get order details from URL parameters
        function getQueryParam(param) {
            const url = new URL(window.location.href);
            return url.searchParams.get(param);
        }

        // Get order type
        const orderType = getQueryParam('type') || 'unknown';
        const orderData = getQueryParam('data') ? JSON.parse(decodeURIComponent(getQueryParam('data'))) : {};

        // Update title and details based on order type
        function displayOrderDetails() {
            const detailsDiv = document.getElementById('details');
            const title = document.getElementById('title');
            const subtitle = document.getElementById('subtitle');

            if (orderType === 'prem') {
                title.textContent = '💎 Premium Buyurtma Qabul Qilindi!';
                subtitle.textContent = 'Telegram Premium tez orada faollashtiriladi';
                
                detailsDiv.innerHTML = `
                    <div class="detail-row">
                        <span class="detail-label">Telegram Username:</span>
                        <span class="detail-value">${orderData.username || '-'}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Premium Davomiyligi:</span>
                        <span class="detail-value">${orderData.plan || '-'}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Aloqa:</span>
                        <span class="detail-value">${orderData.contact || 'Kiritilmadi'}</span>
                    </div>
                `;
            } 
            else if (orderType === 'boost') {
                title.textContent = '⚡ Boost Buyurtma Qabul Qilindi!';
                subtitle.textContent = 'Telegram kanalining boosti tez orada qo\'shiladi';
                
                detailsDiv.innerHTML = `
                    <div class="detail-row">
                        <span class="detail-label">Kanal/Guruh Linki:</span>
                        <span class="detail-value">${orderData.link || '-'}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Boost Soni:</span>
                        <span class="detail-value">${orderData.count || '-'} ta</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Aloqa:</span>
                        <span class="detail-value">${orderData.contact || 'Kiritilmadi'}</span>
                    </div>
                `;
            }
            else if (orderType === 'gift') {
                title.textContent = '🎁 Gift Buyurtma Qabul Qilindi!';
                subtitle.textContent = 'Giftlar tez orada yuboriladi';
                
                detailsDiv.innerHTML = `
                    <div class="detail-row">
                        <span class="detail-label">Giftlar:</span>
                        <span class="detail-value">${orderData.items || '-'}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Telegram Username:</span>
                        <span class="detail-value">${orderData.username || '-'}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Aloqa:</span>
                        <span class="detail-value">${orderData.contact || 'Kiritilmadi'}</span>
                    </div>
                `;
            }
        }

        // Display order details on page load
        displayOrderDetails();

        // Countdown timer
        let countdown = 10;
        const countdownEl = document.getElementById('countdown');
        
        const timer = setInterval(() => {
            countdown--;
            countdownEl.textContent = countdown;
            
            if (countdown <= 0) {
                clearInterval(timer);
                goHome();
            }
        }, 1000);

        // Navigation functions
        function goHome() {
            window.location.href = 'index.html';
        }

        function newOrder() {
            // Stop the timer
            clearInterval(timer);
            window.location.href = 'index.html';
        }
    </script>

</body>
</html>
